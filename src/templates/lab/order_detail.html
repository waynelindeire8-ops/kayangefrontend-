{% extends "base.html" %}
{% block content %}
<div id="order-root"><div class="text-center text-muted py-5"><span class="spinner-border spinner-border-sm me-2"></span>Loading lab order…</div></div>

<script>

const LAB_ROLES = ['lab_staff', 'lab_supervisor', 'lab_tech', 'lab_care', 'admin', 'doctor'];
const STEPS = ['ordered', 'collected', 'in_progress', 'completed'];
const STEP_LABELS = {ordered: 'Ordered', collected: 'Sample Collected', in_progress: 'Processing', completed: 'Completed'};
const STEP_ICONS = {ordered: 'bi-clipboard-plus', collected: 'bi-droplet', in_progress: 'bi-gear', completed: 'bi-check-circle-fill'};

async function loadOrder() {
    const root = document.getElementById('order-root');
    let res;
    try { res = await fetchWithAuth('/lab/api/orders/' + orderId); }
    catch (e) { root.innerHTML = '<div class="alert alert-danger">Could not reach the server. Please try again.</div>'; return; }
    if (res.status === 404) { root.innerHTML = '<div class="alert alert-warning">Lab order not found.</div>'; return; }
    if (!res.ok) { root.innerHTML = '<div class="alert alert-danger">Failed to load lab order.</div>'; return; }
    const data = await res.json();
    ORDER = data;
    root.innerHTML = renderOrder(data);
    bindResultsForm();
    await loadResults(data);
}

function renderOrder(o) {
    const e = escHtml;
    const role = (getUser() || {}).role;
    const canEdit = o.status !== 'completed' && LAB_ROLES.indexOf(role) !== -1;
    const statusColor = o.status === 'completed' ? 'success' : o.status === 'in_progress' ? 'primary' : o.status === 'collected' ? 'info' : 'secondary';
    const idx = STEPS.indexOf(o.status);
    const priority = o.priority === 'stat'
        ? '<span class="badge bg-danger"><i class="bi bi-exclamation-circle me-1"></i>STAT</span>'
        : o.priority === 'urgent'
        ? '<span class="badge bg-warning text-dark"><i class="bi bi-exclamation-triangle me-1"></i>Urgent</span>'
        : '<span class="badge bg-light text-dark">Normal</span>';
    const timeline = STEPS.map((step, i) => {
        const done = i <= idx, cur = i === idx;
        return '<div class="flex-fill text-center position-relative">'
            + '<div class="rounded-circle mx-auto mb-1 d-flex align-items-center justify-content-center ' + (done ? 'bg-success text-white' : 'bg-light text-muted') + '" style="width:36px;height:36px' + (cur ? ';box-shadow:0 0 0 3px rgba(34,197,94,0.3)' : '') + '"><i class="bi ' + STEP_ICONS[step] + '"></i></div>'
            + '<div class="' + (done ? 'fw-semibold text-success' : 'text-muted') + '">' + STEP_LABELS[step] + '</div></div>'
            + (i < STEPS.length - 1 ? '<div style="flex:0 0 30px;height:2px;background:' + (i < idx ? 'linear-gradient(90deg,#22c55e,#22c55e)' : '#e2e8f0') + ';margin-bottom:1rem"></div>' : '');
    }).join('');
    let actions = '';
    if (o.status !== 'completed') {
        actions = '<hr><div class="d-flex gap-2 flex-wrap">'
          + (o.status === 'ordered' ? '<button class="btn btn-info text-white btn-sm" onclick="changeStatus(\'collected\')"><i class="bi bi-droplet me-1"></i>Mark Collected</button>' : '')
          + (o.status === 'collected' ? '<button class="btn btn-primary btn-sm" onclick="changeStatus(\'in_progress\')"><i class="bi bi-play me-1"></i>Start Processing</button>' : '')
          + (['ordered', 'collected', 'in_progress'].indexOf(o.status) !== -1 ? '<button class="btn btn-success btn-sm" onclick="completeOrder()"><i class="bi bi-check-lg me-1"></i>Complete &amp; Save</button>' : '')
          + '</div>';
    }
    const prev = (o.previous_orders || []).map(po =>
        '<tr><td><a href="/lab/orders/' + e(po.id) + '">#' + e(po.id) + '</a></td><td>' + e(po.ordered_date) + '</td>'
        + '<td><span class="badge bg-' + (po.status === 'completed' ? 'success' : 'secondary') + '">' + e(po.status) + '</span></td>'
        + '<td>' + (e(po.completed_date) || '-') + '</td>'
        + '<td><a href="/lab/orders/' + e(po.id) + '" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a></td></tr>').join('');
    const prevCard = prev ? '<div class="card"><div class="card-header"><h6>Previous "' + e(o.test_name) + '" Orders</h6></div><div class="card-body p-0"><table class="table table-sm mb-0"><thead><tr><th>#</th><th>Date</th><th>Status</th><th>Completed</th><th></th></tr></thead><tbody>' + prev + '</tbody></table></div></div>' : '';
    const completedBanner = o.status === 'completed'
        ? '<div class="alert alert-success d-flex align-items-center"><i class="bi bi-check-circle-fill me-2"></i><div>This order is <strong>completed</strong>.' + (o.completed_date ? '<small class="text-muted ms-2">Completed on ' + e(o.completed_date) + '</small>' : '') + '</div></div>'
        : '';
    const editBtns = canEdit
        ? '<button class="btn btn-sm btn-outline-primary" onclick="addResultRow()"><i class="bi bi-plus-lg me-1"></i>Add Row</button><button class="btn btn-sm btn-outline-success" onclick="autoDetectFlags()"><i class="bi bi-magic me-1"></i>Auto-Detect Flags</button>' : '';
    const saveBtns = canEdit
        ? '<div class="d-flex gap-2 mt-3"><button type="submit" class="btn btn-primary px-4" id="btn-save-results"><i class="bi bi-save me-1"></i>Save Results</button><button type="button" class="btn btn-success px-4" id="btn-complete" onclick="completeOrder()"><i class="bi bi-check-lg me-1"></i>Complete &amp; Save</button></div>' : '';
    return `
<div class="page-header">
    <h4><i class="bi bi-flask"></i> Lab Order #${e(o.id)}</h4>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-primary" onclick="printResults()"><i class="bi bi-printer me-1"></i>Print</button>
        <a href="/lab/orders" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Orders</a>
    </div>
</div>
${completedBanner}
<div class="row g-3">
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-header"><h6>Patient &amp; Order Info</h6></div>
            <div class="card-body">
                <table class="table-details">
                    <tr><td>Order #</td><td><strong>${e(o.id)}</strong></td></tr>
                    <tr><td>Patient</td><td><strong><a href="/patients/${e(o.patient_id)}">${e(o.p_first)} ${e(o.p_last)}</a></strong><br><small class="text-muted">${e(o.p_patient_id)} ${o.p_phone ? '&middot; ' + e(o.p_phone) : ''}</small></td></tr>
                    ${o.dob ? '<tr><td>DOB</td><td>' + e(o.dob) + ' ' + (o.gender ? '(' + e(o.gender) + ')' : '') + '</td></tr>' : ''}
                    <tr><td>Test</td><td><strong>${e(o.test_name)}</strong></td></tr>
                    <tr><td>Category</td><td><span class="badge bg-secondary">${e(o.test_category) || 'general'}</span></td></tr>
                    ${o.sample_type ? '<tr><td>Sample Type</td><td><i class="bi bi-droplet me-1"></i>' + e(o.sample_type) + '</td></tr>' : ''}
                    ${o.barcode ? '<tr><td>Barcode</td><td><code>' + e(o.barcode) + '</code></td></tr>' : ''}
                    <tr><td>Priority</td><td>${priority}</td></tr>
                    <tr><td>Doctor</td><td>Dr. ${e(o.d_first)} ${e(o.d_last)}</td></tr>
                    <tr><td>Ordered</td><td>${e(o.ordered_date)} ${e(o.ordered_time)}</td></tr>
                    <tr><td>Status</td><td><span class="badge bg-${statusColor}">${e(String(o.status || '').replace(/_/g, ' '))}</span></td></tr>
                </table>
            </div>
        </div>
        <div class="card mb-3">
            <div class="card-header"><h6>Sample Tracking</h6></div>
            <div class="card-body">
                <table class="table-details">
                    <tr><td>Collected</td><td>${o.sample_collected_date ? e(o.sample_collected_date) : '<span class="text-muted">Not yet</span>'}</td></tr>
                    <tr><td>Collector</td><td>${o.coll_first ? e(o.coll_first) + ' ' + e(o.coll_last) : '-'}</td></tr>
                    <tr><td>Result Date</td><td>${e(o.completed_date) || '-'}</td></tr>
                </table>
            </div>
        </div>
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h6 class="mb-0">Notes</h6>
                ${o.status !== 'completed' ? '<button class="btn btn-sm btn-outline-primary" onclick="editNotes()"><i class="bi bi-pencil"></i></button>' : ''}
            </div>
            <div class="card-body">
                <div id="notes-display">${o.notes ? e(o.notes) : '<span class="text-muted">No notes</span>'}</div>
                <div id="notes-edit" style="display:none">
                    <textarea class="form-control" id="notes-input" rows="3">${e(o.notes)}</textarea>
                    <button class="btn btn-sm btn-primary mt-2" onclick="saveNotes()"><i class="bi bi-save me-1"></i>Save</button>
                    <button class="btn btn-sm btn-outline-secondary mt-2" onclick="cancelNotes()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card mb-3">
            <div class="card-header"><h6>Status Timeline</h6></div>
            <div class="card-body">
                <div class="d-flex align-items-center gap-0" style="font-size:0.85rem">${timeline}</div>
                ${actions}
            </div>
        </div>
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h6>Results <span class="badge bg-secondary" id="result-count">0</span></h6>
                <div class="d-flex gap-2">${editBtns}</div>
            </div>
            <div class="card-body">
                <form id="results-form">
                    <div class="table-responsive">
                    <table class="table table-sm" id="results-table">
                        <thead><tr>
                            <th style="min-width:150px">Parameter</th><th style="min-width:100px">Value</th><th style="width:80px">Unit</th>
                            <th style="width:100px">Ref Range</th><th style="width:100px">Flag</th><th style="width:30px"></th>
                        </tr></thead>
                        <tbody id="results-tbody"></tbody>
                    </table>
                    </div>
                    <div id="no-results" class="text-center text-muted py-4" style="display:none">
                        <i class="bi bi-journal-x" style="font-size:1.5rem;display:block;margin-bottom:0.25rem"></i>
                        No results yet. Add parameters or load from catalog defaults.
                    </div>
                    ${saveBtns}
                </form>
            </div>
        </div>
        ${prevCard}
    </div>
</div>`;
}
const orderId = window.ROUTE_ID;
let ORDER = null;
let rowsChanged = false;

document.addEventListener('DOMContentLoaded', loadOrder);

async function loadResults(data) {
    const tbody = document.getElementById('results-tbody');
    const empty = document.getElementById('no-results');
    tbody.innerHTML = '';
    let count = 0;

    if (data.results && data.results.length) {
        empty.style.display = 'none';
        data.results.forEach(r => { addRow(r); count++; });
    } else if (data.catalog && data.catalog.default_params) {
        empty.style.display = 'none';
        try {
            const params = JSON.parse(data.catalog.default_params);
            params.forEach(p => {
                addRow({ parameter_name: p.parameter_name, unit: p.unit, ref_range: p.ref_range });
                count++;
            });
        } catch(e) {
            empty.style.display = 'block';
        }
    } else {
        empty.style.display = 'block';
    }
    document.getElementById('result-count').textContent = count;
}

function addRow(data) {
    const tbody = document.getElementById('results-tbody');
    const tr = document.createElement('tr');
    const idx = tbody.children.length;
    const flagColors = { normal: '#22c55e', high: '#ef4444', low: '#f59e0b', critical_high: '#dc2626', critical_low: '#dc2626', pending: '#94a3b8' };
    const flag = data.flag || 'pending';
    tr.innerHTML = `<td><input type="text" class="form-control form-control-sm" name="param_${idx}" value="${escHtml(data.parameter_name || '')}" required></td>
<td><input type="text" class="form-control form-control-sm" name="val_${idx}" value="${escHtml(data.value || '')}" oninput="autoFlag(this)" style="${flag !== 'normal' && flag !== 'pending' ? 'font-weight:600' : ''}"></td>
<td><input type="text" class="form-control form-control-sm" name="unit_${idx}" value="${escHtml(data.unit || '')}"></td>
<td><input type="text" class="form-control form-control-sm" name="ref_${idx}" value="${escHtml(data.ref_range || '')}"></td>
<td><select class="form-select form-select-sm" name="flag_${idx}" onchange="flagColor(this)" style="background-color:${flagColors[flag] || '#f1f5f9'}20;color:${flagColors[flag] || '#64748b'};border-color:${flagColors[flag] || '#e2e8f0'}">
<option value="normal" ${flag === 'normal' ? 'selected' : ''}>Normal</option>
<option value="high" ${flag === 'high' ? 'selected' : ''}>High ↑</option>
<option value="low" ${flag === 'low' ? 'selected' : ''}>Low ↓</option>
<option value="critical_high" ${flag === 'critical_high' ? 'selected' : ''}>Critical High ↑↑</option>
<option value="critical_low" ${flag === 'critical_low' ? 'selected' : ''}>Critical Low ↓↓</option>
<option value="pending" ${flag === 'pending' || (!flag && !data.value) ? 'selected' : ''}>Pending</option></select></td>
<td><button type="button" class="btn btn-sm btn-outline-danger border-0" onclick="this.closest('tr').remove(); rowsChanged=true; updateCount()"><i class="bi bi-x"></i></button></td>`;
    tbody.appendChild(tr);
    document.getElementById('no-results').style.display = 'none';
    rowsChanged = true;
    updateCount();
}

function addResultRow() { addRow({}); }

function updateCount() {
    document.getElementById('result-count').textContent = document.getElementById('results-tbody').children.length;
}

function autoFlag(input) {
    const tr = input.closest('tr');
    const val = parseFloat(input.value);
    if (isNaN(val)) return;
    const ref = tr.querySelector('input[name^="ref_"]').value;
    if (!ref) return;
    const m = ref.match(/[\d.]+/g);
    if (!m || m.length < 2) return;
    const lo = parseFloat(m[0]), hi = parseFloat(m[1]);
    const sel = tr.querySelector('select[name^="flag_"]');
    if (val > hi * 1.5) sel.value = 'critical_high';
    else if (val > hi) sel.value = 'high';
    else if (val < lo * 0.5) sel.value = 'critical_low';
    else if (val < lo) sel.value = 'low';
    else sel.value = 'normal';
    flagColor(sel);
}

function flagColor(sel) {
    const flagColors = { normal: '#22c55e', high: '#ef4444', low: '#f59e0b', critical_high: '#dc2626', critical_low: '#dc2626', pending: '#94a3b8' };
    const c = flagColors[sel.value] || '#94a3b8';
    sel.style.backgroundColor = c + '20';
    sel.style.color = c;
    sel.style.borderColor = c;
}

function autoDetectFlags() {
    document.querySelectorAll('#results-tbody tr').forEach(tr => {
        const valInput = tr.querySelector('input[name^="val_"]');
        if (valInput && valInput.value) autoFlag(valInput);
    });
    showToast('Flags auto-detected', 'success');
}

function bindResultsForm() {
    document.getElementById('results-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        await saveResults(false);
    });
}

async function saveResults(complete) {
    const tbody = document.getElementById('results-tbody');
    const results = [];
    tbody.querySelectorAll('tr').forEach(tr => {
        const inputs = tr.querySelectorAll('input');
        const sel = tr.querySelector('select');
        results.push({
            parameter_name: inputs[0].value,
            value: inputs[1].value,
            unit: inputs[2].value,
            reference_range: inputs[3].value,
            flag: sel ? sel.value : 'pending'
        });
    });
    const btnId = complete ? 'btn-complete' : 'btn-save-results';
    const btn = document.getElementById(btnId);
    const origHtml = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';
    const res = await fetchWithAuth('/lab/api/orders/' + orderId + '/results', {
        method: 'POST',
        body: JSON.stringify({ results, complete })
    });
    btn.disabled = false; btn.innerHTML = origHtml;
    if (res.ok) {
        showToast(complete ? 'Order completed!' : 'Results saved', 'success');
        rowsChanged = false;
        if (complete) setTimeout(() => location.reload(), 1000);
    } else {
        const err = await res.json();
        showToast(err.error || 'Failed to save results', 'danger');
    }
}

async function completeOrder() {
    if (!confirm('Mark this order as completed? This will finalize the results.')) return;
    await saveResults(true);
}

async function changeStatus(status) {
    const res = await fetchWithAuth('/lab/api/orders/' + orderId + '/status', {
        method: 'PUT',
        body: JSON.stringify({ status })
    });
    if (res.ok) location.reload();
    else {
        const err = await res.json();
        showToast(err.error || 'Failed to update', 'danger');
    }
}

function editNotes() {
    document.getElementById('notes-display').style.display = 'none';
    document.getElementById('notes-edit').style.display = '';
    document.getElementById('notes-input').focus();
}

function cancelNotes() {
    document.getElementById('notes-display').style.display = '';
    document.getElementById('notes-edit').style.display = 'none';
}

async function saveNotes() {
    const notes = document.getElementById('notes-input').value.trim();
    const res = await fetchWithAuth('/lab/api/orders/' + orderId + '/notes', {
        method: 'PUT',
        body: JSON.stringify({ notes })
    });
    if (res.ok) {
        document.getElementById('notes-display').innerHTML = notes ? escHtml(notes) : '<span class="text-muted">No notes</span>';
        cancelNotes();
        showToast('Notes saved', 'success');
    }
}

function printResults() {
    const tbody = document.getElementById('results-tbody');
    let rows = '';
    tbody.querySelectorAll('tr').forEach((tr, i) => {
        const inputs = tr.querySelectorAll('input');
        const sel = tr.querySelector('select');
        const flagText = sel ? sel.options[sel.selectedIndex].text : '';
        rows += '<tr><td>' + (i+1) + '</td><td>' + escHtml(inputs[0].value) + '</td><td>' + escHtml(inputs[1].value) + '</td><td>' + escHtml(inputs[2].value) + '</td><td>' + escHtml(inputs[3].value) + '</td><td>' + escHtml(flagText) + '</td></tr>';
    });
    const win = window.open('', '_blank');
    win.document.write('<html><head><title>Lab Results #' + escHtml(ORDER.id) + '</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#f5f5f5}.header{text-align:center;margin-bottom:20px}.info{margin-bottom:15px}dt{font-weight:bold;display:inline}dd{display:inline;margin:0 10px 0 0}</style></head><body>' +
        '<div class="header"><h2>Kayange Clinic</h2><p>Laboratory Investigation Report</p></div>' +
        '<div class="info"><dl><dt>Order #:</dt><dd>' + escHtml(ORDER.id) + '</dd><dt>Patient:</dt><dd>' + escHtml(ORDER.p_first) + ' ' + escHtml(ORDER.p_last) + ' (' + escHtml(ORDER.p_patient_id) + ')</dd><dt>Doctor:</dt><dd>Dr. ' + escHtml(ORDER.d_first) + ' ' + escHtml(ORDER.d_last) + '</dd><dt>Test:</dt><dd>' + escHtml(ORDER.test_name) + '</dd><dt>Category:</dt><dd>' + escHtml(ORDER.test_category) + '</dd><dt>Date Ordered:</dt><dd>' + escHtml(ORDER.ordered_date) + '</dd><dt>Status:</dt><dd>' + escHtml(ORDER.status) + '</dd></dl></div>' +
        '<table><thead><tr><th>#</th><th>Parameter</th><th>Value</th><th>Unit</th><th>Ref Range</th><th>Flag</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<p style="margin-top:20px"><strong>Notes:</strong> ' + escHtml(ORDER.notes || 'None') + '</p>' +
        '<div style="margin-top:30px;font-size:10px;color:#666;text-align:center">Kayange Clinic | Laboratory Department</div></body></html>');
    win.document.close(); win.print();
}

function escHtml(str) {
    if (str === null || str === undefined || str === '') return '';
    const d = document.createElement('div');
    d.textContent = String(str);
    return d.innerHTML;
}
</script>

<style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#f5f5f5}.header{text-align:center;margin-bottom:20px}.info{margin-bottom:15px}dt{font-weight:bold;display:inline}dd{display:inline;margin:0 10px 0 0}</style>
{% endblock %}
